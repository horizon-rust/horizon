# `cargo xtask …` runs the repository's task crate, so the commands in docs/perf-platform.md and
# web/perf/README.md work as written. `cargo run -p xtask -- …` stays equivalent.
[alias]
xtask = "run --package xtask --"
# Portable fast rebuild. The native release build is tools/build-runtime.sh,
# because a cargo alias cannot set RUSTFLAGS.
dev = "build --locked --profile fast -p horizon-client -p horizon-prepare"
