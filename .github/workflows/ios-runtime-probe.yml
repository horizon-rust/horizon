name: iOS upstream game compile probe

on:
  push:
    branches: [test]
    paths:
      - 'platforms/ios/GameRuntime/**'
      - '.github/workflows/ios-runtime-probe.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-game-ios-compile:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Apply minimal iOS-only allocator pointer compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-threads/src/allocator_stats.rs")
          old = "std::ffi::CStr::from_ptr(raw)"
          new = "std::ffi::CStr::from_ptr(raw.cast())"
          source = path.read_text()
          assert source.count(old) == 1, "Upstream allocator changed; review patch before applying"
          path.write_text(source.replace(old, new, 1))
          PY
          # All modifications stay in the ephemeral runner checkout.
          git diff -- crates/horizon-threads/src/allocator_stats.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client-input/Cargo.toml")
          old = 'arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }'
          new = 'arboard = { version = "3.6.1", default-features = false }'
          source = path.read_text()
          assert source.count(old) == 1, "Upstream clipboard dependency changed; review patch"
          path.write_text(source.replace(old, new, 1))
          PY
          git diff -- crates/horizon-client-input/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-hdr/src/lib.rs")
          source = path.read_text()
          old = '#[cfg(not(target_os = "macos"))]'
          ios_safe = '#[cfg(not(any(target_os = "macos", target_os = "ios")))]'
          assert source.count(old) == 3, "Upstream HDR API changed; review patch"
          source = source.replace(old, ios_safe)
          old_mac = '#[cfg(target_os = "macos")]'
          assert source.count(old_mac) == 1
          source = source.replace(old_mac, '#[cfg(any(target_os = "macos", target_os = "ios"))]')
          stub = (
              "\n// iOS is Metal-only here. Vulkan HDR metadata does not apply.\n"
              "#[cfg(target_os = \"ios\")]\n"
              "pub fn open_vulkan_device(\n"
              "    _adapter: &wgpu::Adapter,\n"
              "    _desc: &wgpu::DeviceDescriptor<'_>,\n"
              ") -> Option<Result<(wgpu::Device, wgpu::Queue), wgpu::RequestDeviceError>> {\n"
              "    None\n"
              "}\n"
          )
          anchor = '/// wgpu\'s opt-in to its'
          assert source.count(anchor) == 1
          source = source.replace(anchor, stub + chr(10) + anchor)
          path.write_text(source)
          PY
          git diff -- crates/horizon-hdr/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client-input/src/keybinds.rs")
          source = path.read_text()
          old_import = '    use winit::platform::modifier_supplement::KeyEventExtModifierSupplement;'
          old_match = '    match event.key_without_modifiers() {'
          assert source.count(old_import) == 1 and source.count(old_match) == 1
          source = source.replace(old_import, '    // iOS: use platform-provided logical keys (modifier supplement unavailable).')
          source = source.replace(old_match, '    match &event.logical_key {')
          path.write_text(source)
          PY
          git diff -- crates/horizon-client-input/src/keybinds.rs



      - name: Trace desktop Wayland dependency on iOS
        shell: bash
        run: |
          cargo tree --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --target aarch64-apple-ios -i wayland-backend \
            > ios-wayland-tree.log 2>&1 || true
          tail -n 130 ios-wayland-tree.log
      - name: Test offline resource importer
        run: cargo test --manifest-path platforms/ios/AssetImporter/Cargo.toml
      - name: Cross-check the original Horizon game for iOS
        id: crosscheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --target aarch64-apple-ios 2>&1 | tee ios-runtime-check.log
      - name: Build and link original Horizon game static library for iOS
        id: linkprobe
        if: steps.crosscheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo build --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --release --target aarch64-apple-ios 2>&1 | tee ios-runtime-link.log
          test -s platforms/ios/GameRuntime/target/aarch64-apple-ios/release/libhorizon_ios_game_runtime.a
      - name: Install XcodeGen
        if: steps.linkprobe.outcome == 'success'
        run: brew install xcodegen
      - name: Stage the compiled original game for the iOS host
        if: steps.linkprobe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platforms/ios/Build/rust
          cp platforms/ios/GameRuntime/target/aarch64-apple-ios/release/libhorizon_ios_game_runtime.a \
             platforms/ios/Build/rust/libhorizon_ios_game_runtime.a
          ls -lh platforms/ios/Build/rust/libhorizon_ios_game_runtime.a
      - name: Generate native iOS app project
        if: steps.linkprobe.outcome == 'success'
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Link real Horizon game into iOS app
        id: app_link
        if: steps.linkprobe.outcome == 'success'
        continue-on-error: true
        working-directory: platforms/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project HorizonIOS.xcodeproj -scheme HorizonIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Derived CODE_SIGNING_ALLOWED=NO \
            HORIZON_IOS_RUST_LIB=horizon_ios_game_runtime build \
            2>&1 | tee ios-app-link.log
          test -d Build/Derived/Build/Products/Release-iphoneos/Nova.app
      - name: Package unsigned integrated iOS app
        id: ipa
        if: steps.app_link.outcome == 'success'
        working-directory: platforms/ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/package/Payload
          ditto Build/Derived/Build/Products/Release-iphoneos/Nova.app \
            Build/package/Payload/Nova.app
          cd Build/package
          zip -qry Nova-game-linked-unsigned.ipa Payload
          unzip -t Nova-game-linked-unsigned.ipa
          if unzip -Z1 Nova-game-linked-unsigned.ipa | grep -Ei '(assets/minecraft/|horizon-resources\.json|GameFiles\.zip)'; then
            echo "::error::Game assets must never be bundled in Nova"
            exit 1
          fi
      - name: Upload integrated unsigned IPA
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Nova-game-linked-unsigned
          path: platforms/ios/Build/package/Nova-game-linked-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload Xcode linker diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonIOS-app-link-diagnostics
          path: platforms/ios/ios-app-link.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish diagnostic log and result
        if: always()
        shell: bash
        run: |
          echo "### Original Horizon iOS compilation" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargo check: ${{ steps.crosscheck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static library build: ${{ steps.linkprobe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Xcode app native link: ${{ steps.app_link.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IPA packaging: ${{ steps.ipa.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a compilation probe, not an in-game launch or device test." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.crosscheck.outcome }}" != success ]]; then
            echo "::warning::Original Horizon game does not yet cross-compile for iOS. See diagnostic log."
          fi
      - name: Upload iOS compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-original-ios-compile-log
          path: |
            ios-wayland-tree.log
            ios-runtime-check.log
            ios-runtime-link.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce real iOS game compile result
        if: always()
        shell: bash
        run: |
          test "${{ steps.crosscheck.outcome }}" = success
          test "${{ steps.linkprobe.outcome }}" = success
          test "${{ steps.app_link.outcome }}" = success
          test "${{ steps.ipa.outcome }}" = success
