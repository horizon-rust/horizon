name: iOS upstream game compile probe

on:
  push:
    branches: [test]
    paths:
      - 'platforms/ios/GameRuntime/**'
      - 'platforms/ios/App/**'
      - 'platforms/ios/project.yml'
      - '.github/workflows/ios-runtime-probe.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-game-ios-compile:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Apply minimal iOS-only allocator pointer compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-threads/src/allocator_stats.rs")
          old = "std::ffi::CStr::from_ptr(raw)"
          new = "std::ffi::CStr::from_ptr(raw.cast())"
          source = path.read_text()
          assert source.count(old) == 1, "Upstream allocator changed; review patch before applying"
          path.write_text(source.replace(old, new, 1))
          PY
          # All modifications stay in the ephemeral runner checkout.
          git diff -- crates/horizon-threads/src/allocator_stats.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client-input/Cargo.toml")
          old = 'arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }'
          new = 'arboard = { version = "3.6.1", default-features = false }'
          source = path.read_text()
          assert source.count(old) == 1, "Upstream clipboard dependency changed; review patch"
          path.write_text(source.replace(old, new, 1))
          PY
          git diff -- crates/horizon-client-input/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-hdr/src/lib.rs")
          source = path.read_text()
          old = '#[cfg(not(target_os = "macos"))]'
          ios_safe = '#[cfg(not(any(target_os = "macos", target_os = "ios")))]'
          assert source.count(old) == 3, "Upstream HDR API changed; review patch"
          source = source.replace(old, ios_safe)
          old_mac = '#[cfg(target_os = "macos")]'
          assert source.count(old_mac) == 1
          source = source.replace(old_mac, '#[cfg(any(target_os = "macos", target_os = "ios"))]')
          stub = (
              "\n// iOS is Metal-only here. Vulkan HDR metadata does not apply.\n"
              "#[cfg(target_os = \"ios\")]\n"
              "pub fn open_vulkan_device(\n"
              "    _adapter: &wgpu::Adapter,\n"
              "    _desc: &wgpu::DeviceDescriptor<'_>,\n"
              ") -> Option<Result<(wgpu::Device, wgpu::Queue), wgpu::RequestDeviceError>> {\n"
              "    None\n"
              "}\n"
          )
          anchor = '/// wgpu\'s opt-in to its'
          assert source.count(anchor) == 1
          source = source.replace(anchor, stub + chr(10) + anchor)
          path.write_text(source)
          PY
          git diff -- crates/horizon-hdr/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client-input/src/keybinds.rs")
          source = path.read_text()
          old_import = '    use winit::platform::modifier_supplement::KeyEventExtModifierSupplement;'
          old_match = '    match event.key_without_modifiers() {'
          assert source.count(old_import) == 1 and source.count(old_match) == 1
          source = source.replace(old_import, '    // iOS: use platform-provided logical keys (modifier supplement unavailable).')
          source = source.replace(old_match, '    match &event.logical_key {')
          path.write_text(source)
          PY
          git diff -- crates/horizon-client-input/src/keybinds.rs



      - name: Apply iOS-only private resources root override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client/src/game/launch_options.rs")
          source = path.read_text()
          old = '            resources: if sibling.join("horizon-resources.json").exists() {'
          new = '''            resources: if cfg!(target_os = "ios") {
                std::env::var_os("NOVA_IOS_RESOURCES")
                    .map(PathBuf::from)
                    .filter(|root| root.join("horizon-resources.json").is_file())
                    .ok_or("Nova: prepared resources not found in the app container")?
            } else if sibling.join("horizon-resources.json").exists() {'''
          assert source.count(old) == 1, "Upstream resource path parser changed"
          path.write_text(source.replace(old, new, 1))
          PY
          git diff -- crates/horizon-client/src/game/launch_options.rs
      - name: Select Metal as Horizon's only iOS graphics backend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/horizon-client-render/src/gfx.rs")
          source = path.read_text()
          old = '    if os == "macos" || wgpu_backend {\n        return vec![Backends::default()];\n    }'
          new = '''    // Nova iOS: UIKit provides a CAMetalLayer, not Vulkan or desktop GL.
              // Choose the native Metal backend regardless of desktop settings.
              if os == "ios" {
                  return vec![Backends::METAL];
              }
              if os == "macos" || wgpu_backend {
                  return vec![Backends::default()];
              }'''
          assert source.count(old) == 1, "Horizon renderer backend order changed"
          path.write_text(source.replace(old, new, 1))
          PY
          git diff -- crates/horizon-client-render/src/gfx.rs

      - name: Add iOS-only engine startup and rendering diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              source = path.read_text()
              assert source.count(old) == 1, f"{path}: upstream code changed for {old[:70]!r}"
              path.write_text(source.replace(old, new, 1))

          entry = Path("crates/horizon-client/src/entry.rs")
          patch(entry, "use crate::{crash, game, logging};",
              '''use crate::{crash, game, logging};

          fn nova_entry_trace(stage: &str) {
              use std::io::Write as _;
              if let Some(path) = std::env::var_os("NOVA_DIAGNOSTIC_LOG") {
                  if let Ok(mut f) = std::fs::OpenOptions::new().append(true).open(path) {
                      let _ = writeln!(f, "[engine-entry] {stage}");
                  }
              }
          }''')
          patch(entry, "pub fn main_with(mods: crate::mod_api::Mods) {",
                '''pub fn main_with(mods: crate::mod_api::Mods) {
              nova_entry_trace("main_with.begin");''')
          patch(entry, "    if let Err(error) = game::run_with() {",
                '''    nova_entry_trace("game.run_with.begin");
              if let Err(error) = game::run_with() {
                  nova_entry_trace(&format!("game.run_with.error: {error}"));''')

          loading = Path("crates/horizon-client/src/game/loading_screen.rs")
          patch(loading, "pub(super) fn run_event_loop(mut game: Game<'_>) -> Result<()> {",
              '''pub(super) fn nova_diag(stage: &str) {
              use std::io::Write as _;
              if let Some(path) = std::env::var_os("NOVA_DIAGNOSTIC_LOG") {
                  if let Ok(mut f) = std::fs::OpenOptions::new().append(true).open(path) {
                      let _ = writeln!(f, "[engine] {stage}");
                  }
              }
          }

          pub(super) fn run_event_loop(mut game: Game<'_>) -> Result<()> {''')
          patch(loading, '''    pub(super) fn resumed(&mut self, event_loop: &ActiveEventLoop) {
                  if self.window.is_some()''',
              '''    pub(super) fn resumed(&mut self, event_loop: &ActiveEventLoop) {
                  nova_diag("winit.resumed");
                  if self.window.is_some()''')
          patch(loading, "        let window = match event_loop.create_window(",
                '''        nova_diag("window.create.begin");
                  let window = match event_loop.create_window(''')
          patch(loading, '''            Err(e) => {
                          self.error = Some(e.into());''',
              '''            Err(e) => {
                          nova_diag(&format!("window.create.failed: {e}"));
                          self.error = Some(e.into());''')
          patch(loading, "        horizon_client::window::settle_created_fullscreen(&window, fullscreen);",
                '''        nova_diag("window.create.succeeded");
                  horizon_client::window::settle_created_fullscreen(&window, fullscreen);''')
          patch(loading, '''        match loading_renderer(
                      window.clone(),''',
                '''        nova_diag("renderer.boot.begin");
                  match loading_renderer(
                      window.clone(),''')
          patch(loading, "            Ok(r) => self.renderer = Some(r),",
                '''            Ok(r) => {
                          nova_diag("renderer.boot.succeeded");
                          self.renderer = Some(r)
                      },''')
          patch(loading, '''                self.error = Some(e);
                          event_loop.exit();''',
                '''                nova_diag(&format!("renderer.boot.failed: {e}"));
                          self.error = Some(e);
                          event_loop.exit();''')
          patch(loading, '''    pub(super) fn set_ui(&mut self, gui: UiResources, root: PathBuf) {
                  log::info!(''',
                '''    pub(super) fn set_ui(&mut self, gui: UiResources, root: PathBuf) {
                  nova_diag("resources.menu-received");
                  log::info!(''')
          patch(loading, '''            Err(e) => self.error = Some(e),
                  }
                  // The title frame's wait starts''',
                '''            Err(e) => {
                          nova_diag(&format!("renderer.menu.failed: {e}"));
                          self.error = Some(e)
                      },
                  }
                  // The title frame's wait starts''')
          patch(loading, "        if !self.shown {",
                "        if !self.shown {\n            nova_diag(\"renderer.first-frame-attempted\");")
          patch(loading, "                Ok(true) if self.gui.is_some() && self.menu.pending.is_none() => {",
                "                Ok(true) if self.gui.is_some() && self.menu.pending.is_none() => {\n                    if !self.title_drawn { nova_diag(\"renderer.title.frame-presented\"); }")

          # Copy existing renderer startup checkpoints into the same file as
          # Nova's launcher and engine breadcrumbs. This also catches driver
          # crashes during instance creation/surface acquisition.
          gfx = Path("crates/horizon-client-render/src/gfx.rs")
          patch(gfx, '''fn startup_step(step: std::fmt::Arguments) {
              log::info!("Horizon renderer: {step}");''',
                '''fn startup_step(step: std::fmt::Arguments) {
              if let Some(path) = std::env::var_os("NOVA_DIAGNOSTIC_LOG") {
                  use std::io::Write as _;
                  if let Ok(mut file) = std::fs::OpenOptions::new().append(true).open(path) {
                      let _ = writeln!(file, "[renderer] {step}");
                      let _ = file.flush();
                  }
              }
              log::info!("Horizon renderer: {step}");''')
          patch(gfx, "    let instance = open(wgpu::Dx12Compiler::Fxc);",
                '''    startup_step(format_args!("backend.{name}.instance.begin"));
                  let instance = open(wgpu::Dx12Compiler::Fxc);
                  startup_step(format_args!("backend.{name}.instance.created"));''')
          patch(gfx, '''    let surface = if offscreen {
                  None
              } else {
                  Some(
                      instance''',
                '''    startup_step(format_args!("gpu.surface.begin"));
                  let surface = if offscreen {
                      None
                  } else {
                      Some(
                          instance''')
          patch(gfx, '''    let adapter = instance
                  .request_adapter(&wgpu::RequestAdapterOptions {''',
                '''    startup_step(format_args!("gpu.surface.created"));
                  startup_step(format_args!("gpu.adapter.begin"));
                  let adapter = instance
                      .request_adapter(&wgpu::RequestAdapterOptions {''')
          patch(gfx, '''        .map_err(|e| NoDevice::NoAdapter(e.to_string()))?;
              Ok((surface, adapter))''',
                '''        .map_err(|e| NoDevice::NoAdapter(e.to_string()))?;
              startup_step(format_args!("gpu.adapter.created"));
              Ok((surface, adapter))''')

          # The older checkpoints started too late for crashes inside
          # loading_renderer, Renderer::new, device selection or a Rust panic.
          patch(gfx, '''    ) -> Result<Self> {
                  let Opened {
                      instance,''',
                '''    ) -> Result<Self> {
                  startup_step(format_args!("renderer.new.entry"));
                  let Opened {
                      instance,''')
          patch(gfx, '''                let _step = crate::spans::startup::step("renderer.open_device");
                      open_device(&window, offscreen, api, layers).await?''',
                '''                startup_step(format_args!("renderer.new.open_device.begin"));
                      let _step = crate::spans::startup::step("renderer.open_device");
                      open_device(&window, offscreen, api, layers).await?''')
          patch(gfx, '''    let wgpu_backend = std::env::var_os("WGPU_BACKEND").is_some();
                  let mut first = None;''',
                '''    startup_step(format_args!("gpu.open_device.begin"));
                  let wgpu_backend = std::env::var_os("WGPU_BACKEND").is_some();
                  let mut first = None;''')
          patch(gfx, '''    ) {
                  match open_device_with(window, offscreen, &order, layers, allow_cpu).await {''',
                '''    ) {
                  startup_step(format_args!("gpu.open_device.try backends={order:?}"));
                  match open_device_with(window, offscreen, &order, layers, allow_cpu).await {''')

          loader = Path("crates/horizon-client/src/game/resource_loader.rs")
          patch(loader, "    let progress = Progress::new();",
                "    loading_screen::nova_diag(\"resources.loading.begin\");\n    let progress = Progress::new();")
          patch(loader, "    let result = EventLoop::new()?.run_app(&mut app);",
                "    loading_screen::nova_diag(\"winit.event-loop.begin\");\n    let event_loop = EventLoop::new()?;\n    loading_screen::nova_diag(\"winit.event-loop.created\");\n    let result = event_loop.run_app(&mut app);\n    loading_screen::nova_diag(\"winit.run-app.returned\");")
          PY
          git diff --stat -- crates/horizon-client/src/entry.rs \
            crates/horizon-client/src/game/loading_screen.rs \
            crates/horizon-client/src/game/resource_loader.rs \
            crates/horizon-client-render/src/gfx.rs

      - name: Trace desktop Wayland dependency on iOS
        shell: bash
        run: |
          cargo tree --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --target aarch64-apple-ios -i wayland-backend \
            > ios-wayland-tree.log 2>&1 || true
          tail -n 130 ios-wayland-tree.log
      - name: Test offline resource importer
        run: cargo test --manifest-path platforms/ios/AssetImporter/Cargo.toml
      - name: Cross-check the original Horizon game for iOS
        id: crosscheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --target aarch64-apple-ios 2>&1 | tee ios-runtime-check.log
      - name: Build and link original Horizon game static library for iOS
        id: linkprobe
        if: steps.crosscheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo build --manifest-path platforms/ios/GameRuntime/Cargo.toml \
            --release --target aarch64-apple-ios 2>&1 | tee ios-runtime-link.log
          test -s platforms/ios/GameRuntime/target/aarch64-apple-ios/release/libhorizon_ios_game_runtime.a
      - name: Install XcodeGen
        if: steps.linkprobe.outcome == 'success'
        run: brew install xcodegen
      - name: Stage the compiled original game for the iOS host
        if: steps.linkprobe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platforms/ios/Build/rust
          cp platforms/ios/GameRuntime/target/aarch64-apple-ios/release/libhorizon_ios_game_runtime.a \
             platforms/ios/Build/rust/libhorizon_ios_game_runtime.a
          ls -lh platforms/ios/Build/rust/libhorizon_ios_game_runtime.a
      - name: Generate native iOS app project
        if: steps.linkprobe.outcome == 'success'
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Link real Horizon game into iOS app
        id: app_link
        if: steps.linkprobe.outcome == 'success'
        continue-on-error: true
        working-directory: platforms/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project HorizonIOS.xcodeproj -scheme HorizonIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Derived CODE_SIGNING_ALLOWED=NO \
            HORIZON_IOS_RUST_LIB=horizon_ios_game_runtime \
            NOVA_GIT_COMMIT="$GITHUB_SHA" NOVA_GIT_RUN="$GITHUB_RUN_ID" build \
            2>&1 | tee ios-app-link.log
          test -d Build/Derived/Build/Products/Release-iphoneos/Nova.app
      - name: Package unsigned integrated iOS app
        id: ipa
        if: steps.app_link.outcome == 'success'
        working-directory: platforms/ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/package/Payload
          ditto Build/Derived/Build/Products/Release-iphoneos/Nova.app \
            Build/package/Payload/Nova.app
          cd Build/package
          zip -qry nova.ipa Payload
          unzip -t nova.ipa
          if unzip -Z1 nova.ipa | grep -Ei '(assets/minecraft/|horizon-resources\.json|GameFiles\.zip)'; then
            echo "::error::Game assets must never be bundled in Nova"
            exit 1
          fi
      - name: Upload integrated unsigned IPA
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nova
          path: platforms/ios/Build/package/nova.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload Xcode linker diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonIOS-app-link-diagnostics
          path: platforms/ios/ios-app-link.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish diagnostic log and result
        if: always()
        shell: bash
        run: |
          echo "### Original Horizon iOS compilation" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargo check: ${{ steps.crosscheck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static library build: ${{ steps.linkprobe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Xcode app native link: ${{ steps.app_link.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IPA packaging: ${{ steps.ipa.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a compilation probe, not an in-game launch or device test." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.crosscheck.outcome }}" != success ]]; then
            echo "::warning::Original Horizon game does not yet cross-compile for iOS. See diagnostic log."
          fi
      - name: Upload iOS compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-original-ios-compile-log
          path: |
            ios-wayland-tree.log
            ios-runtime-check.log
            ios-runtime-link.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce real iOS game compile result
        if: always()
        shell: bash
        run: |
          test "${{ steps.crosscheck.outcome }}" = success
          test "${{ steps.linkprobe.outcome }}" = success
          test "${{ steps.app_link.outcome }}" = success
          test "${{ steps.ipa.outcome }}" = success
