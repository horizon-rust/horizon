# Manual Release Workflow
# Triggered manually (workflow_dispatch). Dispatches the full cross-platform build and release pipeline.

name: Manual Release on Upstream Changes

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag name (e.g. v0.2.32-offline)'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  trigger-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build and Release Horizon Offline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            gh workflow run build-releases.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag_name="$TAG_INPUT"
          else
            gh workflow run build-releases.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
