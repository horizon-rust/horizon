name: iOS host (scaffold)

# Only run when a build-request file changes, or via workflow_dispatch
# (the latter requires these workflows to exist on GitHub's default branch).
on:
  # To request a build on test, create or edit platforms/ios/ci/build-host.txt.
  push:
    branches: [test]
    paths:
      - 'platforms/ios/ci/build-host.txt'
  workflow_dispatch:

# If another manual run starts for the same branch, retire the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-host:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install Rust iOS device target
        run: rustup target add aarch64-apple-ios
      - name: Test offline resource importer and archive safety
        run: cargo test --manifest-path platforms/ios/AssetImporter/Cargo.toml
      - name: Test standalone Rust bridge on host
        run: cargo test --manifest-path platforms/ios/RustBridge/Cargo.toml
      - name: Compile Rust static library for iOS
        run: |
          set -euo pipefail
          cargo build --manifest-path platforms/ios/RustBridge/Cargo.toml \
            --release --target aarch64-apple-ios \
            --target-dir platforms/ios/Build/rust-target
          mkdir -p platforms/ios/Build/rust
          cp platforms/ios/Build/rust-target/aarch64-apple-ios/release/libhorizon_ios_bridge.a \
             platforms/ios/Build/rust/libhorizon_ios_bridge.a
          test -s platforms/ios/Build/rust/libhorizon_ios_bridge.a
      - name: Generate iOS Xcode project
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS app (unsigned)
        working-directory: platforms/ios
        run: |
          set -euo pipefail
          xcodebuild -project HorizonIOS.xcodeproj -scheme HorizonIOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Derived CODE_SIGNING_ALLOWED=NO \
            NOVA_GIT_COMMIT="$GITHUB_SHA" NOVA_GIT_RUN="$GITHUB_RUN_ID" build
          test -d Build/Derived/Build/Products/Release-iphoneos/Nova.app
      - name: Package unsigned host IPA
        working-directory: platforms/ios
        run: |
          set -euo pipefail
          mkdir -p Build/package/Payload
          ditto Build/Derived/Build/Products/Release-iphoneos/Nova.app \
            Build/package/Payload/Nova.app
          cd Build/package
          zip -qry nova.ipa Payload
          unzip -t nova.ipa
          if unzip -Z1 nova.ipa | grep -Ei '(assets/minecraft/|horizon-resources\.json|GameFiles\.zip)'; then
            echo "::error::Game assets must never be bundled in Nova"
            exit 1
          fi
      - name: Upload unsigned host IPA
        uses: actions/upload-artifact@v4
        with:
          name: nova-host
          path: platforms/ios/Build/package/nova.ipa
          if-no-files-found: error
          retention-days: 7
