# Auto Release Workflow
# This workflow checks for new changes on the upstream repository and creates a release automatically.
# It runs on a schedule (every 30 minutes) and on pushes to the main branch.

name: Auto Release on Upstream Changes

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create tags and releases
  packages: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure we have a clean remote "origin"

      - name: Set up Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ludovic111/horizon.git || true
          git fetch upstream --tags

      - name: Determine if upstream main has new commits
        id: diff
        run: |
          upstream_hash=$(git rev-parse upstream/main)
          local_hash=$(git rev-parse origin/main)
          echo "upstream=$upstream_hash" >> $GITHUB_OUTPUT
          echo "local=$local_hash" >> $GITHUB_OUTPUT
          if [ "$upstream_hash" != "$local_hash" ]; then
            echo "needs_release=true" >> $GITHUB_OUTPUT
          else
            echo "needs_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes (fast‑forward only)
        if: steps.diff.outputs.needs_release == 'true'
        run: |
          git checkout main
          git merge --ff-only upstream/main

      - name: Create new tag
        if: steps.diff.outputs.needs_release == 'true'
        id: tag
        run: |
          # Tag format: vYYYY.MM.DD-HHMM-<short‑sha>
          short_sha=$(git rev-parse --short HEAD)
          tag_name="v$(date -u +%Y.%m.%d-%H%M)-${short_sha}"
          git tag -a "$tag_name" -m "Automated release for upstream changes"
          echo "tag=$tag_name" >> $GITHUB_OUTPUT

      - name: Push tag to origin
        if: steps.diff.outputs.needs_release == 'true'
        run: git push origin "${{ steps.tag.outputs.tag }}"

      - name: Generate custom release notes
        if: steps.diff.outputs.needs_release == 'true'
        id: notes
        run: |
          echo "## Changes since last release" > notes.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 @^)..HEAD >> notes.md
          cat notes.md
        
      - name: Create GitHub Release with generated notes
        if: steps.diff.outputs.needs_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body_path: notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
