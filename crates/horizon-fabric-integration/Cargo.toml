[package]
name = "horizon-fabric-integration"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon-Fabric integration layer"

[dependencies]
horizon-fabric-jvm = { path = "../horizon-fabric-jvm" }
horizon-fabric-mapping = { path = "../horizon-fabric-mapping" }
horizon-fabric-loader = { path = "../horizon-fabric-loader" }
horizon-fabric-api = { path = "../horizon-fabric-api" }
horizon-prepare = { path = "../horizon-prepare" }
horizon-client = { path = "../horizon-client" }
horizon-world = { path = "../horizon-world" }
horizon-core = { path = "../horizon-core" }
horizon-theme = { path = "../horizon-theme" }
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
launcher = []