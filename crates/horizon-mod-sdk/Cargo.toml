[package]
name = "horizon-mod-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Write Horizon mods in Rust: WebAssembly components for the horizon:mod world (docs/mods.md)"

[dependencies]
wit-bindgen = { version = "0.60.0", default-features = false, features = ["macros", "realloc"], optional = true }

[features]
default = ["native"]
# The WebAssembly path: guest bindings from `wit/horizon.wit` via wit-bindgen.
wit = ["dep:wit-bindgen"]
# The native path: plain Rust types, Host traits and a native vtable
# from the same file (`src/native.rs`, generated by `crates/native-gen`),
# for a mod compiled into the process.
native = []

[lints]
workspace = true
