[package]
name = "horizon-fabric-loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fabric Loader reimplementation in Rust"

[dependencies]
horizon-fabric-jvm = { path = "../horizon-fabric-jvm" }
horizon-fabric-jni = { path = "../horizon-fabric-jni" }
horizon-fabric-mapping = { path = "../horizon-fabric-mapping" }
horizon-fabric-mixin = { path = "../horizon-fabric-mixin" }
horizon-core = { path = "../horizon-core" }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
zip = "0.6"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"