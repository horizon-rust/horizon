[package]
name = "horizon-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Horizon's mod runtime: mods compiled into the process (docs/mods.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
# The native bindings (types, Host traits, vtable) the runtime impls sit on:
# a mod compiled into the process calls the host through them. No wasmtime.
horizon-mod-sdk = { path = "../horizon-mod-sdk", features = ["native"], optional = true }
# Turns a mod's core module into a component (cargo horizon-mod build, the tests).
wit-component = { version = "0.254", optional = true }
wit-parser = { version = "0.254", optional = true }
# The functions a mod imports, for its API level (src/api_level.rs): the game and the registry index.
wasmparser = { version = "0.254", optional = true }
# The registry index's checks (feature `index`): SHA-256, and minisign signatures (no dependencies of its own).
sha2 = { version = "0.10", optional = true }
minisign-verify = { version = "0.3", optional = true }
# A shader pack's check (kind `shader`): the one the game runs before it loads a pack.
horizon-shader-api = { path = "../horizon-shader-api", optional = true }

[dev-dependencies]
# The example mods and the test guests run in tests/sandbox.rs with their
# code compiled into this test binary, through their `__native_mod()`.
coords-hud = { path = "../horizon-mod-sdk/examples/coords-hud" }
predator-missile = { path = "../horizon-mod-sdk/examples/predator-missile" }
welcome = { path = "../horizon-mod-sdk/examples/welcome" }
beacons = { path = "../horizon-mod-sdk/examples/beacons" }
spin-lib = { path = "../horizon-mod-sdk/examples/spin-lib" }
spin-bell = { path = "../horizon-mod-sdk/examples/spin-bell" }
cells = { path = "../horizon-mod-sdk/examples/cells" }
cells-ui = { path = "../horizon-mod-sdk/examples/cells-ui" }
horizon-mods-test-guest = { path = "tests/guest" }
horizon-mods-test-ui-guest = { path = "tests/ui_guest" }
# docs/api/mods-reference.md from the WIT contract (tests/api_reference.rs).
wit-parser = "0.254"

[features]
# Loads and runs mods (the game's `mods` feature); without it only manifests,
# content and packaging. The runtime is the SDK's native bindings: a mod
# compiled into the process calls the host directly, in `catch_unwind`.
runtime = ["dep:horizon-mod-sdk", "dep:wasmparser"]
pack = ["dep:wit-component", "dep:wit-parser"]
# The mod registry's index (docs/api/mod-index.md): the launcher, the registry server and its CI.
index = ["dep:sha2", "dep:minisign-verify", "dep:horizon-shader-api", "dep:wasmparser"]

# Runs real mods: `cargo test -p horizon-mods --features runtime,pack`.
[[test]]
name = "sandbox"
required-features = ["runtime", "pack"]

# docs/api/mods-reference.md from the WIT contract (HORIZON_WRITE_DOCS=1 rewrites it).
[[test]]
name = "api_reference"
required-features = ["pack"]

[lints]
workspace = true
