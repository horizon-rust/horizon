[package]
name = "horizon-hooks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game's extension points for crates above the engine: hooks and the platform registries (docs/layers.md)"

[dependencies]
# Tailcat (`tailcat.rs`): the helper's events, its checksum and its download.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
log = "0.4"

[lints]
workspace = true
