[package]
name = "horizon-report"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The pause menu's Report Bugs screen: the player's sentence and the machine's details, shown whole, then posted to the telemetry server as a GitHub issue (docs/telemetry.md)"

[dependencies]
horizon-platform = { path = "../horizon-platform" }
# `endpoint()` only: the telemetry server's address and the switch that turns it off.
horizon-telemetry = { path = "../horizon-telemetry", default-features = false }
log = "0.4"
serde_json = "1.0.151"
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true
