[package]
name = "horizon-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A public address for a world at home: a self-hostable frontend that routes players by the hostname in their handshake to hosts that dialled out to it"

[dependencies]
horizon-friends = { path = "../horizon-friends" }
horizon-relay = { path = "../horizon-relay" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "horizon-gateway"
path = "src/main.rs"

[lints]
workspace = true
