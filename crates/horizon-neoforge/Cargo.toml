[package]
name = "horizon-neoforge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Java mod compatibility (fork NeuHorizon): the NeoForge and Minecraft classes a compiled NeoForge mod registers its content with, written as a Horizon content mod"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-items = { path = "../horizon-items" }
horizon-java = { path = "../horizon-java" }
horizon-world = { path = "../horizon-world" }
serde_json = "1"
wasmtime = { version = "48.0.7", default-features = false, features = ["runtime", "cranelift", "std", "gc-drc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
