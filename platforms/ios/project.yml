name: HorizonIOS
options:
  bundleIdPrefix: dev.horizonios
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HorizonIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: GameHost
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Horizon iOS
        LSRequiresIPhoneOS: true
        UIApplicationSupportsDocumentBrowser: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizonios.host
        PRODUCT_NAME: HorizonIOS
        SWIFT_OBJC_BRIDGING_HEADER: RustBridge/include/HorizonBridge.h
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Build/rust
        HORIZON_IOS_RUST_LIB: horizon_ios_bridge
        OTHER_LDFLAGS:
          - $(inherited)
          - -l$(HORIZON_IOS_RUST_LIB)
          - -framework
          - AudioToolbox
        CODE_SIGN_STYLE: Manual
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  HorizonIOS:
    build:
      targets:
        HorizonIOS: all
